name: Publish v0.7.0

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.7.0.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'mfrtechconsult/PokePCFollowers'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Validate release bundle
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool mod.card >/dev/null
          unzip -t mod.zip
          test "$(unzip -p mod.zip main.lua | sha256sum | cut -d' ' -f1)" = "$(sha256sum main.lua | cut -d' ' -f1)"
          test "$(unzip -Z1 mod.zip | grep -Ec '^assets/sprites/follower_[0-9]{3}\.png$')" = "251"
          test "$(unzip -Z1 mod.zip | awk -F/ 'NF > 1 {print $1}' | sort -u | tr '\n' ' ')" = "assets overrides "

      - name: Prepare release and restore original layout
        run: |
          cp mod.zip PokePCFollowers-v0.7.0.zip
          git rm .github/workflows/release-v0.7.0.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary v0.7.0 release workflow"
          git push origin HEAD:main
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.7.0 PokePCFollowers-v0.7.0.zip \
            --target "$RELEASE_TARGET" \
            --title "PokéPC Followers v0.7.0" \
            --notes $'Adds Pokédex-proportional follower sizes for all 251 supported Pokémon.\n\n- Uses each species Pokédex height, including Crystal 251 data for Generation II.\n- Keeps the smallest followers readable at a minimum of 11 pixels.\n- Uses progressive one-pixel size steps and safe limits for giant species.\n- Preserves one-cell collision and movement behavior.\n- Supports 2D rendering, Dramatic Shape, Dramaless Shape and Battle Art Voxel Fork.\n- Keeps the original project directory layout.'
