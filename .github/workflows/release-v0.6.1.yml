name: Publish v0.6.1

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-v0.6.1.yml

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'mfrtechconsult/PokePCFollowers'
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4

      - name: Validate release bundle
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool mod.card >/dev/null
          unzip -t mod.zip

      - name: Prepare named release asset
        run: cp mod.zip PokePCFollowers-v0.6.1.zip

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.6.1 >/dev/null 2>&1; then
            echo "Release v0.6.1 already exists; nothing to publish."
            exit 0
          fi
          gh release create v0.6.1 PokePCFollowers-v0.6.1.zip \
            --target "${{ github.sha }}" \
            --title "PokéPC Followers v0.6.1" \
            --notes-file RELEASE_NOTES_v0.6.1.md
